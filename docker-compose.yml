services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: nutrilens
      MYSQL_USER: nutrilens
      MYSQL_PASSWORD: dev_only_change_me
      MYSQL_ROOT_PASSWORD: dev_root_change_me
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  mysql_data:
