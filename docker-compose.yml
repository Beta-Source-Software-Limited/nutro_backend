services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: nutrilens
      MYSQL_USER: nutrilens
      MYSQL_PASSWORD: dev_only_change_me
      MYSQL_ROOT_PASSWORD: dev_root_change_me
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+pymysql://nutrilens:dev_only_change_me@mysql:3306/nutrilens
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data: